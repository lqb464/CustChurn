services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      LENDSCOPE_MODEL_PATH: outputs/models/lendscope.joblib
    volumes:
      - ./outputs/models:/app/outputs/models:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      LENDSCOPE_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
