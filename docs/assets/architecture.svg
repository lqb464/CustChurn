<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Kiến trúc LendScope</title>
  <desc id="desc">Luồng từ dữ liệu và notebook tới pipeline, artifact, API, dashboard và giám sát.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4faf8"/><stop offset="1" stop-color="#e5f1ed"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#123c35"/><stop offset="1" stop-color="#1f6f5f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#163c34" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#527d72"/>
    </marker>
  </defs>
  <rect width="1200" height="470" rx="22" fill="url(#bg)"/>
  <rect x="35" y="30" width="1130" height="74" rx="16" fill="url(#hero)"/>
  <text x="70" y="65" fill="#fff" font-family="Segoe UI,Arial" font-size="25" font-weight="700">LendScope</text>
  <text x="70" y="88" fill="#dff5ee" font-family="Segoe UI,Arial" font-size="14">Regression có điều kiện, từ thí nghiệm đến hệ thống hỗ trợ quyết định</text>

  <g filter="url(#shadow)" font-family="Segoe UI,Arial">
    <rect x="45" y="155" width="185" height="145" rx="15" fill="#fff" stroke="#b9d8cf"/>
    <text x="65" y="190" fill="#123c35" font-size="17" font-weight="700">Dữ liệu</text>
    <text x="65" y="220" fill="#47665e" font-size="13">30.000 hồ sơ train</text>
    <text x="65" y="244" fill="#47665e" font-size="13">Population target &gt; 0</text>
    <text x="65" y="268" fill="#47665e" font-size="13">Schema và quality gate</text>

    <rect x="280" y="155" width="185" height="145" rx="15" fill="#fff" stroke="#b9d8cf"/>
    <text x="300" y="190" fill="#123c35" font-size="17" font-weight="700">Data Science</text>
    <text x="300" y="220" fill="#47665e" font-size="13">EDA và feature</text>
    <text x="300" y="244" fill="#47665e" font-size="13">CV và model selection</text>
    <text x="300" y="268" fill="#47665e" font-size="13">SHAP và error analysis</text>

    <rect x="515" y="155" width="185" height="145" rx="15" fill="#fff" stroke="#b9d8cf"/>
    <text x="535" y="190" fill="#123c35" font-size="17" font-weight="700">ML Pipeline</text>
    <text x="535" y="220" fill="#47665e" font-size="13">Raw-to-prediction</text>
    <text x="535" y="244" fill="#47665e" font-size="13">Artifact có version</text>
    <text x="535" y="268" fill="#47665e" font-size="13">Khoảng dự báo 90%</text>

    <rect x="750" y="155" width="185" height="145" rx="15" fill="#fff" stroke="#b9d8cf"/>
    <text x="770" y="190" fill="#123c35" font-size="17" font-weight="700">Serving</text>
    <text x="770" y="220" fill="#47665e" font-size="13">FastAPI</text>
    <text x="770" y="244" fill="#47665e" font-size="13">Single và batch scoring</text>
    <text x="770" y="268" fill="#47665e" font-size="13">Business caps</text>

    <rect x="985" y="155" width="170" height="145" rx="15" fill="#fff" stroke="#b9d8cf"/>
    <text x="1005" y="190" fill="#123c35" font-size="17" font-weight="700">Decision Support</text>
    <text x="1005" y="220" fill="#47665e" font-size="13">Streamlit dashboard</text>
    <text x="1005" y="244" fill="#47665e" font-size="13">Manual review queue</text>
    <text x="1005" y="268" fill="#47665e" font-size="13">Input warnings</text>
  </g>

  <g stroke="#527d72" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M230 227 H273"/><path d="M465 227 H508"/><path d="M700 227 H743"/><path d="M935 227 H978"/>
  </g>

  <rect x="280" y="355" width="655" height="65" rx="14" fill="#fff8eb" stroke="#e3bd7e"/>
  <text x="310" y="383" fill="#7b5420" font-family="Segoe UI,Arial" font-size="15" font-weight="700">Vòng kiểm soát</text>
  <text x="310" y="405" fill="#795f3b" font-family="Segoe UI,Arial" font-size="13">Tests · CI · drift · uncertainty · fairness audit · chuyên viên phê duyệt</text>
  <path d="M1070 305 C1070 390 990 388 943 388" stroke="#cf8d32" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M280 388 C175 388 138 340 138 309" stroke="#cf8d32" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
</svg>
