[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lendscope"
version = "1.0.0"
description = "Regression system for estimating historically sanctioned loan amounts"
requires-python = ">=3.10,<3.15"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "joblib>=1.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "pydantic>=2.6", "uvicorn[standard]>=0.27"]
frontend = ["streamlit>=1.36", "requests>=2.31"]
notebooks = [
    "ipykernel>=6.0", "jupyter>=1.0", "matplotlib>=3.7", "mlflow>=2.10",
    "nbformat>=5.9", "plotly>=5.14", "seaborn>=0.12", "shap>=0.44",
]
dev = ["httpx>=0.27", "pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short --basetemp=.pytest_tmp"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
